<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number System Game</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:24px;color:#222}
.game{max-width:650px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 4px 18px #0002}
h1{margin-top:0}.stats{display:flex;gap:18px;flex-wrap:wrap;font-weight:bold}
.question{margin-top:20px;padding:22px;background:#f0f0f0;border-radius:14px}
.big{font-size:36px;font-weight:bold;margin:10px 0}
input,button{font-size:17px;padding:12px;border-radius:9px;border:1px solid #bbb}
input{width:calc(100% - 28px);margin:8px 0}
button{cursor:pointer;font-weight:bold;margin-right:8px}
.good{color:green}.bad{color:#b00020}
</style>
</head>
<body>
<div class="game">
<h1>🎮 Number System Game</h1>
<p>Convert the number into the requested base.</p>
<div class="stats">
<span>Level: <b id="level">1</b></span>
<span>Lives: <b id="lives">3</b></span>
<span>Score: <b id="score">0</b></span>
<span>Time: <b id="time">30</b>s</span>
</div>
<div class="question">
<div>Convert:</div>
<div class="big" id="number">41₁₀</div>
<div id="task">Decimal → Binary</div>
<form id="form">
<input id="answer" autocomplete="off" placeholder="Enter your answer">
<button>Check</button>
</form>
<div id="message"></div>
</div>
<p><button type="button" id="hint">💡 Hint</button><button type="button" id="restart">↻ Restart</button></p>
<div id="hintText"></div>
</div>
<script>
const questions=[
["41₁₀","Decimal → Binary","101001","Divide by 2 and read remainders upward."],
["58₁₀","Decimal → Octal","72","Divide by 8 and read remainders upward."],
["58₁₀","Decimal → Hexadecimal","3A","Divide by 16; A represents 10."],
["101101₂","Binary → Decimal","45","Use powers of 2."],
["246₈","Octal → Decimal","166","Use powers of 8."],
["3A₁₆","Hexadecimal → Decimal","58","3×16 + A."],
["101101₂","Binary → Octal","55","Group binary digits in groups of 3."],
["10101111₂","Binary → Hexadecimal","AF","Group binary digits in groups of 4."],
["2F₁₆","Hexadecimal → Octal","57","Convert through binary."],
["57₈","Octal → Hexadecimal","2F","Convert through binary."]
];
let i=0,score=0,lives=3,time=30,timer;
const $=id=>document.getElementById(id);
function render(){
 clearInterval(timer);
 if(i>=questions.length){finish();return}
 const q=questions[i];
 $("number").textContent=q[0];$("task").textContent=q[1];
 $("level").textContent=Math.floor(i/3)+1;$("lives").textContent=lives;$("score").textContent=score;
 $("time").textContent=time=30;$("answer").value="";$("message").textContent="";$("hintText").textContent="";
 $("answer").focus();
 timer=setInterval(()=>{time--;$("time").textContent=time;if(time<=0){clearInterval(timer);lives--; $("lives").textContent=lives;$("message").textContent="Time up! Correct answer: "+q[2];$("message").className="bad";if(lives<=0)setTimeout(finish,800);else setTimeout(()=>{i++;render()},1000)}},1000);
}
function finish(){clearInterval(timer);$("number").textContent="🏆";$("task").textContent="Game Complete";$("message").textContent="Final score: "+score+" / "+questions.length;$("message").className="good";$("form").style.display="none";}
$("form").addEventListener("submit",e=>{
 e.preventDefault(); if(i>=questions.length)return;
 const q=questions[i],v=$("answer").value.trim().toUpperCase();
 if(v===q[2].toUpperCase()){score++;$("score").textContent=score;$("message").textContent="✓ Correct!";$("message").className="good";clearInterval(timer);setTimeout(()=>{i++;render()},600)}
 else{lives--; $("lives").textContent=lives;$("message").textContent=lives?"✗ Wrong. Try again.":"✗ No lives left.";$("message").className="bad";if(!lives)setTimeout(finish,700)}
});
$("hint").onclick=()=>{if(i<questions.length)$("hintText").textContent=questions[i][3]};
$("restart").onclick=()=>{i=0;score=0;lives=3;$("form").style.display="block";render()};
render();
</script>
</body>
</html>
